name: Latest blog posts

on:
  schedule:
    - cron: '0 1 * * *'   # every day, 06:30 in Delhi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://yogya.dev/feed.xml'
          max_post_count: 4
          commit_message: 'Update the latest blog posts'